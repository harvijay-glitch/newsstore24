<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 86" role="img" aria-labelledby="title desc">
  <title id="title">NewsStore24</title>
  <desc id="desc">NewsStore24 latest updates logo</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef233c" />
      <stop offset="0.55" stop-color="#e60012" />
      <stop offset="1" stop-color="#be123c" />
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#dc2626" flood-opacity="0.22" />
    </filter>
  </defs>
  <rect x="4" y="14" width="62" height="62" rx="16" fill="url(#brand)" filter="url(#shadow)" />
  <text x="35" y="54" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="900" text-anchor="middle">NS</text>
  <text x="84" y="27" fill="#e60012" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="4">LATEST UPDATES</text>
  <text x="84" y="64" fill="#020617" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900">NewsStore24</text>
</svg>
